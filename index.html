<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/light.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6/dist/tippy-bundle.umd.min.js"></script>

  <link rel="stylesheet" href="main.css" />
  <title>The Vitamin D Index</title>
</head>

<body>
  <div class="main-container">
    <div class="header">
      <div class="heading"> Where Is It Easiest to Get Sunburnt on Holiday? </div>
      <div class="desc"> Select a month to explore how sunburn risk varies by season across popular holiday destinations
        worldwide. </div>
    </div>

    <div class="calendar">
      <div class="all month active" data-month="all"> All</div>
      <div class="jan month" data-month="data-january"> Jan</div>
      <div class="feb month" data-month="data-february"> Feb</div>
      <div class="mar month" data-month="data-march"> Mar</div>
      <div class="apr month" data-month="data-april"> Apr</div>
      <div class="may month" data-month="data-may"> May</div>
      <div class="jun month" data-month="data-june"> Jun</div>
      <div class="jul month" data-month="data-july"> Jul</div>
      <div class="aug month" data-month="data-august"> Aug</div>
      <div class="sep month" data-month="data-septermber"> Sep</div>
      <div class="oct month" data-month="data-october"> Oct</div>
      <div class="nov month" data-month="data-november"> Nov</div>
      <div class="dec month" data-month="data-december"> Dec</div>
    </div>
    <div class="map-container">
      <div id="map"> </div>
      <!-- reset buttons -->
      <div class="zoom-icons">
        <button class="zoom-icon plus">
          <img src="./images/zoomplus.svg" alt='zoom-plus' />
        </button>
        <button class="zoom-icon minus">
          <img src="./images/zoomminus.svg" alt='zoom-minus' />
        </button>
      </div>
    </div>

    <div id="table-container"></div>

  </div>

  <script src="/js/table.js"></script>
  <script src="/js/map.js"></script>
  <script src='/js/main.js'> </script>

</body>

</html>
